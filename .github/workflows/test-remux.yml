name: Test TS remux
on:
  workflow_dispatch:
    inputs:
      vod:
        default: "2937116418"
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test tool
        run: clang -fobjc-arc -ISources Sources/DVRemuxer.m test/main.m -framework Foundation -framework AVFoundation -framework CoreMedia -framework AudioToolbox -framework CoreGraphics -framework CoreVideo -o remux 2>&1 | tail -30
      - name: Build nal tool
        run: clang -fobjc-arc test/nals.m -framework Foundation -framework AVFoundation -framework CoreMedia -o nals 2>/dev/null
      - name: Fetch a real Twitch VOD (TS) and remux
        env:
          VOD: ${{ inputs.vod }}
        run: |
          Q='query PlaybackAccessToken_Template($login: String!, $isLive: Boolean!, $vodID: ID!, $isVod: Boolean!, $playerType: String!) { streamPlaybackAccessToken(channelName: $login, params: {platform: "web", playerBackend: "mediaplayer", playerType: $playerType}) @include(if: $isLive) { value signature } videoPlaybackAccessToken(id: $vodID, params: {platform: "web", playerBackend: "mediaplayer", playerType: $playerType}) @include(if: $isVod) { value signature } }'
          BODY=$(jq -nc --arg q "$Q" --arg v "$VOD" '{operationName:"PlaybackAccessToken_Template",query:$q,variables:{isLive:false,login:"",isVod:true,vodID:$v,playerType:"site"}}')
          R=$(curl -s -H "Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko" -H "Content-Type: application/json" -d "$BODY" https://gql.twitch.tv/gql)
          SIG=$(echo "$R" | jq -r '.data.videoPlaybackAccessToken.signature'); TOK=$(echo "$R" | jq -r '.data.videoPlaybackAccessToken.value')
          curl -s -G "https://usher.ttvnw.net/vod/$VOD.m3u8" --data-urlencode "sig=$SIG" --data-urlencode "token=$TOK" -d allow_source=true -d supported_codecs=avc1 -o master.m3u8
          V=$(grep -v '^#' master.m3u8 | head -1); echo "variant: $V"
          curl -s "$V" -o media.m3u8
          BASE=$(dirname "$V")
          grep -E 'EXT-X-MAP' media.m3u8 && echo "::notice::VOD is fMP4" || true
          : > in.ts
          for s in $(grep -v '^#' media.m3u8 | head -4); do
            case "$s" in http*) U="$s";; *) U="$BASE/$s";; esac
            curl -s "$U" >> in.ts || curl -s "${U/-unmuted/-muted}" >> in.ts
          done
          ls -la in.ts
          ./remux in.ts out.mp4 | tee result.txt
          echo "::notice title=remux::$(cat result.txt | tr '\n' ' | ')"
          brew install ffmpeg >/dev/null 2>&1 || true
          echo "::notice title=src probe::$(ffprobe -v error -show_entries stream=codec_name,profile,width,height,r_frame_rate,sample_rate,channels -of compact in.ts | tr '\n' ' ')"
          echo "::notice title=out probe::$(ffprobe -v error -show_entries stream=codec_name,profile,width,height,nb_frames -of compact out.mp4 | tr '\n' ' ')"
          echo "::notice title=src decode::$(ffmpeg -v error -i in.ts -f null - 2>&1 | head -c 600 | tr '\n' ' ')"
          echo "::notice title=out decode::$(ffmpeg -v error -i out.mp4 -f null - 2>&1 | head -c 800 | tr '\n' ' ')"
          ffmpeg -v error -i in.ts -c copy ref.mp4 && ./remux in.ts out2.mp4 >/dev/null
          echo "::notice title=ffmpeg-ref::$(ffprobe -v error -show_entries stream=codec_name,nb_frames,start_time,duration -of compact ref.mp4 | tr '\n' ' ')"
          echo "::notice title=ours::$(ffprobe -v error -show_entries stream=codec_name,nb_frames,start_time,duration -of compact out.mp4 | tr '\n' ' ')"
          echo "::notice title=pkts::$(ffprobe -v error -select_streams v -show_entries packet=pts,dts,flags,size -of csv out.mp4 | head -8 | tr '\n' ' ')"
          echo "::notice title=refpkts::$(ffprobe -v error -select_streams v -show_entries packet=pts,dts,flags,size -of csv ref.mp4 | head -8 | tr '\n' ' ')"
          echo "::notice title=ours nals::$(./nals out.mp4 | tr '\n' ' ')"
          echo "::notice title=ref nals::$(./nals ref.mp4 | tr '\n' ' ')"
          python3 test/tsdump.py in.ts > dump.txt; echo "::notice title=tsdump::$(cat dump.txt | tr '\n' ' ' | head -c 3500)"
          echo "::notice title=ref via our checker::$(./remux in.ts ref.mp4 x | tr '\n' ' ')"
          echo "::notice title=ffmpeg decode ref::$(ffmpeg -v error -i ref.mp4 -f null - 2>&1 | head -c 300 | tr '\n' ' ')"
          echo "::notice title=ffmpeg decode src::$(ffmpeg -v error -i in.ts -f null - 2>&1 | head -c 300 | tr '\n' ' ')"
          echo "::notice title=pkt4::$(ffprobe -v error -select_streams v -show_entries packet=pts,dts,size,pos -of csv in.ts | head -6 | tr '\n' ' ')"
          python3 test/pk.py in.ts > pk.txt; echo "::notice title=pk::$(cat pk.txt | tr '\n' ';')"
